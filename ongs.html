<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ongs - ongs</title>
    <link rel="icon" href="images/favicon.png?v=1" type="image/png">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

    <style>
        :root {
            --font-family: "Pretendard Variable", Pretendard, sans-serif;
            --text-color: black;
            --background-color: white;
            --border-style: 1px solid #000;
            --base-font-size: 15px;
        }

        html, body { height: 100%; margin: 0; overflow: hidden; }
        body { 
            background-color: var(--background-color);
            color: var(--text-color); 
            font-family: var(--font-family);
            font-size: var(--base-font-size);
            line-height: 1.8; 
            display: flex;
            flex-direction: column; 
            padding: 0 40px; 
        }

        /* 헤더 스타일 (110px / 20px 여백) */
        header { 
            flex-shrink: 0;
            border-bottom: var(--border-style); 
            text-align: center;
            padding: 20px 0; 
        }
        .logo-wrapper {
            position: relative;
            display: inline-block;
            height: 110px;
            vertical-align: middle;
            text-decoration: none;
        }
        .main-logo, .logo-wrapper .hover-img { height: 110px; width: auto !important; display: block; transition: opacity 0.3s ease; }
        .logo-wrapper .hover-img { position: absolute; top: 0; left: 50%; transform: translateX(-50%); opacity: 0; }
        .logo-wrapper:hover .default-img { opacity: 0; }
        .logo-wrapper:hover .hover-img { opacity: 1; }

        nav { 
            flex-shrink: 0;
            border-bottom: var(--border-style); 
            padding: 15px 0;
            display: flex; justify-content: center; align-items: center;
        }
        nav a { text-decoration: none; color: black; font-weight: 500; width: 120px; text-align: center; margin: 0 10px; white-space: nowrap; }
        nav a:hover { text-decoration: underline; text-underline-offset: 5px; }

        /* 5단 가로 분할 래퍼 */
        .ongs-wrapper {
            display: flex;
            flex: 1;
            overflow: hidden; 
            width: 100%;
        }

        /* 각 컬럼 스타일 */
        .ong-column {
            flex: 1; 
            border-right: var(--border-style);
            height: 100%;
            overflow-y: auto; /* 개별 스크롤 활성화 */
            padding: 40px 20px; /* 위아래 여백을 줘서 스크롤 시 답답하지 않게 함 */
            box-sizing: border-box;
            scrollbar-width: none; 
            -ms-overflow-style: none;
        }
        .ong-column:last-child { border-right: none; }
        .ong-column::-webkit-scrollbar { width: 4px; }
        .ong-column::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0); border-radius: 10px; }
        .ong-column:hover::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.1); }

        /* 아이템 단위 (아래로 계속 추가되는 요소) */
        .ong-item {
            margin-bottom: 60px; /* 아이템 간 간격 */
        }

        .item-content-box {
            width: 100%;
            border: var(--border-style);
            box-sizing: border-box;
            line-height: 0;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .img-wrap {
            position: relative;
            width: 100%;
            border-bottom: var(--border-style);
            cursor: pointer;
        }
        .ongs-img { width: 100%; height: auto; display: block; transition: opacity 0.3s ease; }
        .img-wrap .hover-img-ong { position: absolute; top: 0; left: 0; opacity: 0; transition: opacity 0.3s ease; width: 100%; }
        .img-wrap:hover .default-img-ong { opacity: 0; }
        .img-wrap:hover .hover-img-ong { opacity: 1; }

        table { width: 100%; border-collapse: collapse; margin: 0; }
        table td { 
            border: none; border-bottom: var(--border-style); border-right: var(--border-style);
            padding: 8px; font-size: 13px; line-height: 1.4; color: black;
        }
        table tr:last-child td { border-bottom: none; }
        table td:last-child { border-right: none; }

        .ong-desc { font-size: 14px; line-height: 1.6; word-break: keep-all; }

        /* 반응형 */
        @media screen and (max-width: 1024px) {
            .ongs-wrapper { flex-wrap: wrap; overflow-y: auto; }
            .ong-column { flex: none; width: 50%; height: auto; border-bottom: var(--border-style); }
            .ong-column:nth-child(even) { border-right: none; }
        }
        @media screen and (max-width: 768px) {
            body { padding: 0 20px !important; }
            header { padding: 15px 0 !important; }
            .logo-wrapper, .main-logo, .logo-wrapper .hover-img { height: 70px !important; }
            .ong-column { width: 100%; border-right: none; padding: 30px 0; }
        }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="logo-wrapper">
        <img src="images/logo.webp?v=1" alt="ongs logo" class="main-logo default-img">
        <img src="images/logo_hover.webp?v=1" alt="ongs logo hover" class="hover-img">
    </a>
</header>

<nav>
    <a href="about.html">소개</a>
    <a href="ongs.html" style="text-decoration: underline; text-underline-offset: 5px;">옹즈</a>
    <a href="journal.html">지팡이통신</a>
</nav>

<div class="ongs-wrapper">
    <div class="ong-column">
        <div class="ong-item">
            <div class="item-content-box">
                <div class="img-wrap">
                    <img src="images/seongju_1.webp" alt="성주옹" class="ongs-img default-img-ong">
                    <img src="images/seongju_1_hover.webp" alt="성주옹 호버" class="hover-img-ong">
                </div>
                <table>
                    <tr><td>Name</td><td>Seongju Ong</td></tr>
                    <tr><td>Material</td><td>Linen, Straw</td></tr>
                </table>
            </div>
            <p class="ong-desc">집의 중심을 지키는 듬직한 성주옹입니다.</p>
        </div>
        
        <div class="ong-item">
            <div class="item-content-box">
                <div class="img-wrap">
                    <img src="images/seongju_2.webp" alt="성주옹 친구" class="ongs-img default-img-ong">
                    <img src="images/seongju_2_hover.webp" alt="성주옹 친구 호버" class="hover-img-ong">
                </div>
                <table>
                    <tr><td>Name</td><td>Seongju Friend</td></tr>
                    <tr><td>Material</td><td>Cotton</td></tr>
                </table>
            </div>
            <p class="ong-desc">성주옹의 새로운 친구입니다.</p>
        </div>
    </div>

    <div class="ong-column">
        <div class="ong-item">
            <div class="item-content-box">
                <div class="img-wrap">
                    <img src="images/buttumak_1.webp" alt="부뚜막옹" class="ongs-img default-img-ong">
                    <img src="images/buttumak_1_hover.webp" alt="부뚜막옹 호버" class="hover-img-ong">
                </div>
                <table>
                    <tr><td>Name</td><td>Buttumak Ong</td></tr>
                    <tr><td>Material</td><td>Leather</td></tr>
                </table>
            </div>
            <p class="ong-desc">따뜻한 온기를 찾아다니는 부뚜막옹입니다.</p>
        </div>
    </div>

    <div class="ong-column"></div>

    <div class="ong-column"></div>

    <div class="ong-column"></div>
</div>

</body>
</html>
