<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ongs - ongs</title>
    <link rel="icon" href="images/favicon.png?v=1" type="image/png">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

    <style>
        :root {
            --font-family: "Pretendard Variable", Pretendard, sans-serif;
            --text-color: black;
            --background-color: white;
            --border-style: 1px solid #000;
            --base-font-size: 15px;
        }

        /* [데스크탑] 기본 설정 */
        html, body { height: 100%; margin: 0; overflow: hidden; }
        body { 
            background-color: var(--background-color);
            color: var(--text-color); 
            font-family: var(--font-family);
            font-size: var(--base-font-size);
            line-height: 1.8; 
            display: flex;
            flex-direction: column; 
            padding: 0 40px; 
        }

        header { 
            flex-shrink: 0;
            border-bottom: var(--border-style); 
            text-align: center;
            padding: 20px 0; 
        }
        
        .logo-wrapper { 
            position: relative; 
            display: inline-block; 
            height: 110px; 
            vertical-align: middle; 
            text-decoration: none; 
            max-width: 100%; /* 잘림 방지 */
        }
        
        .main-logo, .logo-wrapper .hover-img { 
            height: 110px; 
            width: auto !important; 
            display: block; 
            transition: opacity 0.3s ease; 
        }
        
        .logo-wrapper .hover-img { 
            position: absolute; 
            top: 0; 
            left: 50%; 
            transform: translateX(-50%); 
            opacity: 0; 
        }
        
        .logo-wrapper:hover .default-img { opacity: 0; }
        .logo-wrapper:hover .hover-img { opacity: 1; }

        nav { 
            flex-shrink: 0;
            border-bottom: var(--border-style); 
            padding: 15px 0;
            display: flex; justify-content: center; align-items: center;
        }
        nav a { text-decoration: none; color: black; font-weight: 500; width: 120px; text-align: center; margin: 0 10px; white-space: nowrap; }
        nav a:hover { text-decoration: underline; text-underline-offset: 5px; }

        /* [데스크탑] 독립 스크롤 레이아웃 */
        .ongs-wrapper {
            display: flex;
            flex: 1;
            overflow: hidden; 
            width: 100%;
        }

        .ong-column {
            flex: 1;
            height: 100%;
            overflow-y: auto; 
            border-right: var(--border-style);
            padding: 25px 25px 60px 25px; 
            box-sizing: border-box;
            scrollbar-width: none; 
            -ms-overflow-style: none;
        }
        .ong-column:last-child { border-right: none; }
        .ong-column::-webkit-scrollbar { width: 4px; }
        .ong-column::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0); border-radius: 10px; }
        .ong-column:hover::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.1); }

        .ong-item { margin-bottom: 60px; }
        .item-content-box {
            width: 100%;
            border: var(--border-style);
            box-sizing: border-box;
            line-height: 0;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .img-wrap { position: relative; width: 100%; border-bottom: var(--border-style); cursor: pointer; }
        .ongs-img { width: 100%; height: auto; display: block; transition: opacity 0.3s ease; }
        .img-wrap .hover-img-ong { position: absolute; top: 0; left: 0; opacity: 0; transition: opacity 0.3s ease; width: 100%; }
        .img-wrap:hover .default-img-ong { opacity: 0; }
        .img-wrap:hover .hover-img-ong { opacity: 1; }

        table { width: 100%; border-collapse: collapse; margin: 0; }
        table td { 
            border: none; border-bottom: var(--border-style); border-right: var(--border-style);
            padding: 8px; font-size: 13px; line-height: 1.4; color: black;
        }
        table tr:last-child td { border-bottom: none; }
        table td:last-child { border-right: none; }
        .ong-desc { font-size: 14px; line-height: 1.6; word-break: keep-all; margin-top: 10px; }

        /* --- [모바일 대응] --- */
        @media screen and (max-width: 768px) {
            html, body { 
                overflow: auto !important; 
                height: auto !important; 
            }
            body { 
                padding: 0 20px !important; 
            }
            
            header { 
                padding: 15px 0 !important; 
                width: 100%;
                box-sizing: border-box;
                display: flex;
                justify-content: center;
            }
            .logo-wrapper { 
                height: 70px !important; 
                max-width: 100% !important; 
                overflow: hidden;
            }
            .main-logo, .logo-wrapper .hover-img { 
                height: 70px !important; 
                width: auto !important; 
                max-width: 100%;
            }
            .logo-wrapper .hover-img { left: 50%; transform: translateX(-50%); }
            
            nav { padding: 10px 0 !important; flex-wrap: wrap; }
            nav a { width: auto !important; margin: 5px 10px !important; font-size: 14px !important; }

            .ongs-wrapper { 
                display: block !important; 
                overflow: visible !important;
            }
            .ong-column { 
                width: 100% !important; 
                height: auto !important; 
                overflow: visible !important; 
                border-right: none !important; 
                border-bottom: var(--border-style); 
                padding: 40px 0 !important; 
            }
            .ong-column:last-child { border-bottom: none; }
            /* 모바일에서 빈 컬럼 숨기기 */
            .ong-column:empty { display: none; }
        }
    </style>
</head>
