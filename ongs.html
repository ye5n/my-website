<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ongs - ongs</title>
    <link rel="icon" href="images/favicon.png?v=1" type="image/png">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

    <style>
        :root {
            --font-family: "Pretendard Variable", Pretendard, sans-serif;
            --text-color: black;
            --background-color: white;
            --border-style: 1px solid #000;
            --base-font-size: 15px;
        }

        html, body { height: 100%; margin: 0; overflow: hidden; }
        body { 
            background-color: var(--background-color);
            color: var(--text-color); 
            font-family: var(--font-family);
            font-size: var(--base-font-size);
            line-height: 1.8; 
            display: flex;
            flex-direction: column; 
            padding: 0 40px; 
        }

        header { 
            flex-shrink: 0; border-bottom: var(--border-style); text-align: center; padding: 20px 0; 
        }
        .logo-wrapper { position: relative; display: inline-block; height: 110px; vertical-align: middle; text-decoration: none; max-width: 100%; }
        .main-logo, .logo-wrapper .hover-img { height: 110px; width: auto !important; display: block; transition: opacity 0.3s ease; }
        .logo-wrapper .hover-img { position: absolute; top: 0; left: 50%; transform: translateX(-50%); opacity: 0; }
        .logo-wrapper:hover .default-img { opacity: 0; }
        .logo-wrapper:hover .hover-img { opacity: 1; }

        nav { 
            flex-shrink: 0; border-bottom: var(--border-style); padding: 15px 0;
            display: flex; justify-content: center; align-items: center;
        }
        nav a { text-decoration: none; color: black; font-weight: 500; width: 120px; text-align: center; margin: 0 10px; white-space: nowrap; }
        nav a:hover { text-decoration: underline; text-underline-offset: 5px; }

        /* [수정된 레이아웃] 4열 고정 및 자동 줄바꿈 */
        .ongs-container {
            flex: 1;
            overflow-y: auto; /* 전체 영역 스크롤 */
            width: 100%;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .ongs-container::-webkit-scrollbar { width: 4px; }
        .ongs-container::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.1); border-radius: 10px; }

        .ongs-grid {
            display: flex;
            flex-wrap: wrap; /* 4개 차면 아래로 */
            width: 100%;
        }

        .ong-item-wrapper {
            width: 25%; /* 무조건 4열 고정 (100/4) */
            box-sizing: border-box;
            border-right: var(--border-style);
            border-bottom: var(--border-style);
            padding: 25px 25px 40px 25px;
        }
        
        /* 오른쪽 끝 아이템은 테두리 제거 (4의 배수번째) */
        .ong-item-wrapper:nth-child(4n) { border-right: none; }

        .item-content-box {
            width: 100%; border: var(--border-style); box-sizing: border-box; line-height: 0; overflow: hidden; margin-bottom: 15px;
        }
        .img-wrap { position: relative; width: 100%; border-bottom: var(--border-style); cursor: pointer; }
        .ongs-img { width: 100%; height: auto; display: block; transition: opacity 0.3s ease; }
        .img-wrap .hover-img-ong { position: absolute; top: 0; left: 0; opacity: 0; transition: opacity 0.3s ease; width: 100%; }
        .img-wrap:hover .default-img-ong { opacity: 0; }
        .img-wrap:hover .hover-img-ong { opacity: 1; }

        table { width: 100%; border-collapse: collapse; margin: 0; }
        table td { 
            border: none; border-bottom: var(--border-style); border-right: var(--border-style);
            padding: 8px; font-size: 13px; line-height: 1.4; color: black;
        }
        table tr:last-child td { border-bottom: none; }
        table td:last-child { border-right: none; }
        .ong-desc { font-size: 14px; line-height: 1.6; word-break: keep-all; margin-top: 10px; }

        /* --- [모바일] --- */
        @media screen and (max-width: 768px) {
            html, body { overflow: auto !important; height: auto !important; }
            body { padding: 0 20px !important; }
            header { padding: 15px 0 !important; display: flex; justify-content: center; }
            .logo-wrapper { height: 70px !important; overflow: hidden; }
            .main-logo, .logo-wrapper .hover-img { height: 70px !important; }
            
            nav { padding: 10px 0 !important; flex-wrap: wrap; }
            nav a { width: auto !important; margin: 5px 10px !important; font-size: 14px !important; }

            .ongs-grid { display: block !important; }
            .ong-item-wrapper { 
                width: 100% !important; 
                border-right: none !important; 
                padding: 40px 0 !important; 
            }
        }
    </style>
</head>
<body>

<header>

        <img src="images/logo_hover.webp?v=1" alt="ongs logo hover" class="hover-img">
    </a>
</header>

<nav>

                <table>
                    <tr><td>Name</td><td>Seongju Ong</td></tr>

        </div>
        <div class="ong-item-wrapper">

        </div>
        <div class="ong-item-wrapper">
            <div class="item-content-box"><div class="img-wrap"><img src="images/seongju_1.webp" class="ongs-img"></div><table><tr><td>Name</td><td>Fifth Ong</td></tr><tr><td>Type</td><td>New</td></tr></table></div>

    </div>
</div>

</body>
</html>
