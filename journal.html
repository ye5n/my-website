```html
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>journal - ongs</title>

    <link rel="icon" href="images/favicon.png?v=1" type="image/png">

    <link
        rel="stylesheet"
        as="style"
        crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
    />

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --font-family: "Pretendard Variable", Pretendard, sans-serif;
            --text-color: black;
            --background-color: white;
            --border-style: 1px solid #000;
            --base-font-size: 15px;
        }

        html,
        body {
            margin: 0;
            overflow: hidden;
            height: 100vh;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            font-family: var(--font-family);
            font-size: var(--base-font-size);
            line-height: 1.8;
            display: flex;
            flex-direction: column;
            padding: 0 40px;
        }

        header {
            flex-shrink: 0;
            border-bottom: var(--border-style);
            text-align: center;
            padding: 20px 0;
        }

        .logo-wrapper {
            position: relative;
            display: inline-block;
            height: 110px;
            vertical-align: middle;
            text-decoration: none;
        }

        .main-logo {
            height: 110px;
            width: auto;
            display: block;
            transition: opacity 0.3s ease;
        }

        .logo-wrapper .hover-img {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s ease;
            height: 110px;
        }

        .logo-wrapper:hover .default-img {
            opacity: 0;
        }

        .logo-wrapper:hover .hover-img {
            opacity: 1;
        }

        nav {
            flex-shrink: 0;
            border-bottom: var(--border-style);
            padding: 15px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: black;
            font-weight: 500;
            width: 120px;
            text-align: center;
            margin: 0 10px;
        }

        nav a:hover {
            text-decoration: underline;
            text-underline-offset: 5px;
            text-decoration-thickness: 1px;
        }

        nav a.active {
            text-decoration: underline;
            text-underline-offset: 5px;
            text-decoration-thickness: 1px;
        }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
        }

        /* 왼쪽: 기사 리스트 */
        .journal-list {
            flex: 1;
            border-right: var(--border-style);
            padding: 40px;
            overflow-y: auto;
        }

        .journal-list::-webkit-scrollbar {
            display: none;
        }

        /* 기사 리스트 아이템 */
        .list-item {
            cursor: pointer;
            padding: 20px 0;
            border-bottom: 1px solid #000;
            transition: all 0.2s ease;
        }

        .list-item:hover h3,
        .list-item.active h3 {
            text-decoration: underline;
            text-underline-offset: 5px;
            text-decoration-thickness: 1px;
        }

        .list-item.active {
            background-color: transparent;
        }

        .list-item h3 {
            font-size: 17px;
            font-weight: 700;
            margin: 0 0 5px 0;
            line-height: 1.4;
            display: inline-block;
        }

        .list-item small {
            font-size: 13px;
            color: #000;
            display: block;
        }

        .list-item:last-child {
            border-bottom: none;
        }

        /* 오른쪽: 상세 페이지 */
        .journal-detail {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .journal-detail::-webkit-scrollbar {
            width: 4px;
        }

        .journal-detail::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        .detail-view h2 {
            font-size: 26px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 20px;
            line-height: 1.3;
        }

        .title-separator {
            border-bottom: var(--border-style);
            margin-bottom: 30px;
        }

        .detail-view .content {
            font-size: 15px;
            line-height: 1.9;
            text-align: left;
            word-break: keep-all;
            margin-bottom: 40px;
            color: #000;
        }

        .detail-view .date {
            font-size: 13px;
            color: #000;
            display: block;
            font-weight: 400;
            border-top: 1px solid #000;
            padding-top: 20px;
        }

        .detail-view a {
            color: #000;
            text-decoration: underline;
        }

        /* 모바일 대응 */
        @media screen and (max-width: 768px) {
            html,
            body {
                overflow: auto !important;
                height: auto !important;
            }

            body {
                padding: 0 !important;
                font-size: 16px !important;
            }

            header {
                padding: 15px 0 !important;
                display: flex;
                justify-content: center;
                border-bottom: var(--border-style);
                width: 100%;
                box-sizing: border-box;
            }

            .logo-wrapper {
                height: 70px !important;
                width: auto !important;
            }

            .main-logo {
                height: 70px !important;
                width: auto !important;
            }

            .logo-wrapper .hover-img {
                display: none !important;
            }

            nav {
                padding: 12px 0 !important;
                border-bottom: var(--border-style);
            }

            nav a {
                font-size: 16px !important;
                margin: 0 12px !important;
                font-weight: 600 !important;
                width: auto !important;
            }

            .container {
                display: flex !important;
                flex-direction: column !important;
                padding: 0 !important;
                overflow: visible !important;
            }

            .journal-list {
                flex: none !important;
                width: auto !important;
                height: 200px !important;
                border-right: none !important;
                border-bottom: var(--border-style);
                padding: 10px 20px !important;
                background-color: #f9f9f9;
                box-sizing: border-box;
            }

            .journal-detail {
                flex: none !important;
                width: auto !important;
                padding: 40px 25px 60px 25px !important;
                box-sizing: border-box;
                overflow: visible !important;
            }

            .detail-view h2 {
                font-size: 24px !important;
                border-bottom: 1px solid #000 !important;
                padding-bottom: 12px !important;
                margin-bottom: 25px !important;
                word-break: keep-all;
            }

            .detail-view .content {
                font-size: 17px !important;
                line-height: 1.8 !important;
                text-align: left !important;
                word-break: keep-all !important;
            }

            .title-separator {
                display: none !important;
            }

            .list-item:hover h3,
            .list-item.active h3 {
                text-underline-offset: 4px;
            }
        }
    </style>
</head>
```
