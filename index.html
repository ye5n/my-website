<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Onze Gazette</title>
    
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

    <style>
        :root {
            --font-family: "Pretendard Variable", Pretendard, -apple-system, sans-serif;
            --text-color: #000;
            --background-color: #fff;
            --border-color: #000;
            --link-color: #000;
            --base-font-size: 13.5px; 
            --header-font-size: 24px;  
            --title-font-size: 16px;   
        }

        body { 
            background-color: var(--background-color);
            color: var(--text-color); 
            font-family: var(--font-family);
            font-size: var(--base-font-size);
            line-height: 1.6; 
            margin: 0 auto; 
            padding: 40px;
            max-width: 850px;
            word-break: keep-all; 
            -webkit-font-smoothing: antialiased;
        }

        header { 
            border-bottom: 1px solid var(--border-color); 
            margin-bottom: 20px; 
            text-align: left;
            padding-bottom: 10px;
        }
        h1 { 
            font-size: var(--header-font-size); 
            font-weight: 700; 
            margin: 0; 
            letter-spacing: -0.03em; 
        }
        .tagline { 
            font-size: var(--base-font-size); 
            margin-top: 5px; 
            color: #555;
        }

        /* 수정한 네비게이션: 선 사이 정중앙 + 간격 넓게 */
        nav { 
            border-bottom: 1px solid var(--border-color); 
            padding: 15px 0; /* 상하 여백을 똑같이 주어 중앙 정렬 */
            margin-bottom: 30px; 
            display: flex; /* 가로 정렬을 위한 설정 */
        }
        nav a { 
            margin-right: 40px; /* 메뉴 사이 간격 대폭 확장 */
            text-decoration: none; 
            color: var(--link-color); 
            font-weight: 500;
            font-style: normal;
            letter-spacing: 0.02em;
            transition: 0.1s;
        }
        nav a:hover { 
            text-decoration: underline; 
            text-underline-offset: 5px; /* 밑줄을 글자에서 살짝 띄움 */
        }

        /* 레이아웃 (살려낸 아랫부분!) */
        .container { display: flex; gap: 40px; }
        .journal { flex: 2; border-right: 1px solid #eee; padding-right: 20px; }
        .dolls { flex: 1; }

        h2 { 
            font-size: var(--title-font-size); 
            font-weight: 700; 
            margin-top: 0; 
            margin-bottom: 15px; 
        }
        h3 { 
            font-size: var(--base-font-size); 
            font-weight: 700; 
            margin: 5px 0; 
        }
        
        .item { margin-bottom: 30px; border-bottom: 1px dashed #ddd; padding-bottom: 15px; }
        img { max-width: 100%; border: 1px solid #000; }
        
        table { 
            width: 100%; 
            font-size: var(--base-font-size); 
            border-collapse: collapse; 
            margin-top: 10px; 
        }
        table td { border: 1px solid #eee; padding: 6px; }
    </style>
</head>
<body>

<header>
    <h1>ongs town</h1>
    <p class="tagline">Established 2026. 실과 바늘로 엮는 작은 세계.</p>
</header>

<nav>
    <a href="#">지팡이통신</a>
    <a href="#">옹카이브</a>
    <a href="#">어바웃 옹</a>
</nav>

<div class="container">
    <div class="journal">
        <h2>Latest News</h2>
        <div class="item">
            <small>2026.02.16</small>
            <h3>옹즈 소식지 &lt;지팡이통신&gt;의 창간</h3>
            <p>옹즈 신문 &lt;지팡이통신&gt;이 첫 발행되었습니다. </p>
        </div>
    </div>

    <div class="dolls">
        <h2>Dolls</h2>
        <div class="item">
            <img src="doll_sample.jpg" alt="인형 사진">
            <table>
                <tr><td>Name</td><td>Seongju Ong (성주옹)</td></tr>
                <tr><td>Material</td><td>Linen, Cotton</td></tr>
                <tr><td>Date</td><td>2026.02</td></tr>
            </table>
        </div>
    </div>
</div>

</body>
</html>
