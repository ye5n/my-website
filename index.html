<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Onze Gazette</title>
    
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

    <style>
        :root {
            --font-family: "Pretendard Variable", Pretendard, sans-serif;
            --text-color: black;
            --background-color: white;
            --border-color: black;
            --base-font-size: 13.5px; /* 민구홍 스타일 본문 크기 */
        }

        body { 
            background-color: var(--background-color);
            color: var(--text-color); 
            font-family: var(--font-family);
            font-size: var(--base-font-size);
            line-height: 1.6; 
            margin: 0 auto; 
            padding: 40px;
            max-width: 900px;
            word-break: keep-all; 
        }

        /* 1. 상단 중앙 정렬 (다시 살려냈어요!) */
        header { 
            border-bottom: 1px solid var(--border-color); 
            margin-bottom: 20px; 
            text-align: center; /* 다시 중앙으로! */
            padding-bottom: 0px;
        }
        h1 { 
            font-size: 2.5rem; 
            font-weight: 700; 
            margin: 0; 
            letter-spacing: -1px; 
        }
        .tagline { margin-top: 5px; color: #666; }

        /* 2. 네비게이션 중앙 정렬 + 간격 넓히기 */
        nav { 
            border-bottom: 1px solid var(--border-color); 
            padding: 20px 0; /* 위아래 여백을 주어 선 사이 정중앙 배치 */
            margin-bottom: 30px; 
            text-align: center; /* 메뉴들 중앙 정렬 */
        }
        nav a { 
            margin: 0 50px; /* 좌우 간격을 30px로 넓혀서 시원하게 */
            text-decoration: none; 
            color: black; 
            font-weight: 500;
            transition: 0.1s;
        }
        nav a:hover { 
            text-decoration: underline; 
            text-underline-offset: 5px;
        }

        /* 3. 아랫부분 레이아웃 (완벽 복구) */
        .container { display: flex; gap: 40px; text-align: left; } /* 본문은 왼쪽 정렬 */
        .journal { flex: 2; border-right: 1px solid #eee; padding-right: 20px; }
        .dolls { flex: 1; }

        h2 { font-size: 16px; font-weight: 700; margin-bottom: 15px; }
        h3 { font-size: 13.5px; font-weight: 700; margin: 5px 0; }
        
        .item { margin-bottom: 30px; border-bottom: 1px dashed #ddd; padding-bottom: 15px; }
        img { max-width: 100%; border: 1px solid #000; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        table td { border: 1px solid #eee; padding: 6px; }
    </style>
</head>
<body>

<header>
    <h1>ongs town</h1>
    <p class="tagline">Established 2026. 실과 바늘로 엮는 작은 세계.</p>
</header>

<nav>
    <a href="#">지팡이통신</a>
    <a href="#">옹카이브</a>
    <a href="#">어바웃 옹</a>
</nav>

<div class="container">
    <div class="journal">
        <h2>Latest News</h2>
        <div class="item">
            <small>2026.02.16</small>
            <h3>옹즈 소식지 &lt;지팡이통신&gt;의 창간</h3>
            <p>옹즈 신문 &lt;지팡이통신&gt;이 첫 발행되었습니다.</p>
        </div>
    </div>

    <div class="dolls">
        <h2>Dolls</h2>
        <div class="item">
            <img src="doll_sample.jpg" alt="인형 사진">
            <table>
                <tr><td>Name</td><td>Seongju Ong (성주옹)</td></tr>
                <tr><td>Material</td><td>Linen, Cotton</td></tr>
                <tr><td>Date</td><td>2026.02</td></tr>
            </table>
        </div>
    </div>
</div>

</body>
</html>
