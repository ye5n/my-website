<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <title>Onze Gazette</title>
    <style>
     /* 핸드메이드 웹 느낌을 주는 최소한의 CSS */
        body { 
            background-color: #fdfaf6; /* 종이 질감 색상 */
            color: #222; 
            font-family: "Gowun Dodum", sans-serif;
            font-weight: 400;
            font-style: normal;
            line-height: 1.8; 
            margin: 0; padding: 40px;
            max-width: 900px; margin: auto;
        }
        header { border-bottom: 2px solid #000; margin-bottom: 20px; text-align: center; }
        h1 { font-size: 3rem; margin-bottom: 5px; letter-spacing: -1px; }
        nav { border-bottom: 1px solid #000; padding-bottom: 10px; margin-bottom: 30px; text-align: center; }
        nav a { margin: 0 15px; text-decoration: underline; color: blue; }

        /* 신문 느낌의 레이아웃 */
        .container { display: flex; gap: 40px; }
        .journal { flex: 2; border-right: 1px solid #ccc; padding-right: 20px; }
        .dolls { flex: 1; }

        .item { margin-bottom: 30px; border-bottom: 1px dashed #999; padding-bottom: 10px; }
        img { max-width: 100%; filter: grayscale(20%); border: 1px solid #000; }
        table { width: 100%; font-size: 0.9rem; border-collapse: collapse; margin-top: 10px; }
        table td { border: 1px solid #ddd; padding: 5px; }
    </style>
</head>
<body>

<header>
    <h1>ongs town</h1>
    <p>Established 2026. 실과 바늘로 엮는 작은 세계.</p>
</header>

<nav>
    <a href="#">지팡이통신</a>
    <a href="#">옹카이브</a>
    <a href="#">어바웃 옹</a>
</nav>

<div class="container">
    <div class="journal">
        <h2>지팡이통신 최신 소식</h2>
        <div class="item">
            <small>2026.02.16</small>
            <h3>옹즈 소식지 <지팡이통신>의 창간</h3>
            <p>옹즈 신문 <지팡이통신>이 첫 발행되었습니다. </p>
        </div>
    </div>

    <div class="옹즈">
        <h2>Dolls</h2>
        <div class="item">
            <img src="doll_sample.jpg" alt="인형 사진">
            <table>
                <tr><td>Name</td><td>Seongju Ong (성주옹)</td></tr>
                <tr><td>Material</td><td>Linen, Cotton</td></tr>
                <tr><td>Date</td><td>2026.02</td></tr>
            </table>
        </div>
    </div>
</div>

</body>
</html>
